{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>📦 Votre adresse de livraison</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label">Nom complet *</label>
                                <input type="text" class="form-control" name="full_name" 
                                       value="{{ address.full_name if address }}" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Adresse ligne 1 *</label>
                                <input type="text" class="form-control" name="address_line1" 
                                       value="{{ address.address_line1 if address }}" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Adresse ligne 2</label>
                                <input type="text" class="form-control" name="address_line2" 
                                       value="{{ address.address_line2 if address }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ville *</label>
                                <input type="text" class="form-control" name="city" 
                                       value="{{ address.city if address }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Code postal *</label>
                                <input type="text" class="form-control" name="postal_code" 
                                       value="{{ address.postal_code if address }}" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Pays *</label>
                                <input type="text" class="form-control" name="country" 
                                       value="{{ address.country if address else 'France' }}" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                💾 Enregistrer l'adresse
                            </button>
                            <a href="{{ url_for('cart_view') }}" class="btn btn-outline-secondary">
                                ← Retour au panier
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
